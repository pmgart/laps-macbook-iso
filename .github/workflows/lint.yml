name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    name: shellcheck + bash -n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: |
          set -e
          for f in *.sh tools/*.sh; do bash -n "$f"; echo "ok: $f"; done
      - name: ShellCheck
        run: shellcheck -x -S warning *.sh tools/*.sh

  python:
    name: python syntax + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python3 -m py_compile add-efi-boot.py make-efi-img.py
      - name: Kernel detection tests
        run: python3 -m unittest discover -s tests -v
